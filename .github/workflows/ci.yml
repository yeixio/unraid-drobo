name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: node --check src/usr/local/emhttp/plugins/drobo/drobo.js
      - run: xmllint --noout --noent plugin/drobo.plg || (sudo apt-get install -y libxml2-utils >/dev/null && xmllint --noout --noent plugin/drobo.plg)
      - run: build/package.sh 0000.00.00
