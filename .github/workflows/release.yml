name: Release
# Publish a release either by pushing a tag like v2026.11.19, or from the
# Actions tab with "Run workflow" (it tags the current main for you).
# Unraid then sees the update.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (YYYY.MM.DD, a letter suffix like 2026.11.19a for a second release that day)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pick version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "$V" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}[a-z]?$' || { echo "bad version: $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: go test ./...
      - run: build/package.sh "$VERSION"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
